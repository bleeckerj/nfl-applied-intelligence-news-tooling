<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Content Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <h1>Newspaper Content Inventory</h1>
                <p class="subtitle">Layout-Free Data Recovery & Inspection</p>
                <div class="controls">
                    <label for="file-input" class="button">Load Structured JSON</label>
                    <input type="file" id="file-input" accept=".json">
                    <span id="file-name">No file loaded</span>
                </div>
                <div class="view-options" style="margin-top: 1rem; display: flex; gap: 1rem; align-items: center;">
                    <label for="sort-mode" style="font-family: var(--font-mono); font-size: 0.8rem;">Sort:</label>
                    <select id="sort-mode" style="padding: 0.25rem;">
                        <option value="reading">Reading Order (Page > Top > Left)</option>
                        <option value="page-y">Vertical Layout (Page > Top)</option>
                        <option value="id">ID (Creation Order)</option>
                    </select>
                    
                    <label for="filter-mode" style="font-family: var(--font-mono); font-size: 0.8rem; margin-left: 1rem;">Show:</label>
                    <select id="filter-mode" style="padding: 0.25rem;">
                        <option value="all">All Content</option>
                        <option value="images">Images Only</option>
                        <option value="text">Text Only</option>
                    </select>
                </div>
            </div>
        </header>
        
        <main id="inventory-list">
            <div class="empty-state">
                <p>Select a <code>_structured.json</code> file to view content inventory.</p>
            </div>
            <!-- Stories will be injected here -->
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
